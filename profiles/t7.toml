array_literal = { value = false, confidence = "verified-on-corpus", source = ["corpus-t7", "gsc-tool-syntax"], note = "0 uses in the shipped scripts (absence of use, not proof of absence)" }
struct_literal = { value = false, confidence = "assumed", source = ["inference"], note = "0 uses in corpus-t7 (absence of use, not proof of absence)" }
isdefined_form = { value = "keyword", confidence = "documented", source = ["bo3-gsc-language-doc", "gsc-tool-syntax"] }
istrue_operator = { value = false, confidence = "assumed", source = ["inference"], note = "0 uses in corpus-t7 (absence of use, not proof of absence)" }
opcode_builtins = { value = ["abs", "angleclamp180", "anglestoforward", "anglestoright", "anglestoup", "getdvar", "getdvarcoloralpha", "getdvarcolorblue", "getdvarcolorgreen", "getdvarcolorred", "getdvarfloat", "getdvarint", "getdvarvector", "getfirstarraykey", "getnextarraykey", "gettime", "vectorscale", "vectortoangles"], confidence = "documented", source = ["gsc-tool-syntax", "bo3-gsc-language-doc"], note = "the BO3 doc keyword list names gettime and vectorscale among these" }
bare_call_resolution = { value = "namespace-first", confidence = "measured-in-engine", source = ["vm-t7-emulation", "bo3-gsc-language-doc", "linker-t7-probes"], note = "measured in the emulated VM (semantics/t7.toml): the compiler emits <current namespace>::f for every bare call; at load the game's linker takes the current namespace's script function first, else the builtin (calls and &f), never a function of another namespace even when #using'd (unresolved external); thread f() never falls back to a builtin. gscode's builtin-first claim does not hold on T7" }
global_objects = { value = ["self", "level", "game", "anim", "world", "classes"], confidence = "documented", source = ["bo3-gsc-language-doc", "gscode-game-profiles", "gsc-tool-syntax"], note = "world: 2 uses in the corpus" }
# --- Semantics that change analysis
array_argument_passing = { value = "copy-unless-ref-param", confidence = "measured-in-engine", source = ["vm-t7-emulation", "bo3-gsc-language-doc", "linker-t7-probes"], note = "measured in the emulated VM (semantics/t7.toml): a plain parameter gets a deep copy (SafeCreateLocalVariables + CopyArray), a &name parameter shares the caller's array (a non-array there is a script error); plain assignment b = a shares the array (no copy, no copy on write). gscode's by-reference claim holds only for &name" }
waittill_multiple_events = { value = false, confidence = "measured-in-engine", source = ["vm-t7-emulation#waittill_more_args_sent", "vm-t7-emulation#waittill_fewer_args_sent"], note = "the arguments after the event are names the VM binds the notify's values to" }
endon_multiple_events = { value = false, confidence = "verified-on-corpus", source = ["corpus-t7"], note = "0 endon with more than one argument in the mod-tools scripts (absence of use, not proof of absence); not run in the T7 VM" }
notify_wakes_waiters = { value = "deferred", confidence = "measured-in-engine", source = ["vm-t7-emulation#notify_wakes_waiter_before_notifier_continues", "vm-t7-emulation#notify_reentrant", "vm-t7-emulation#notify_wake_order_two_waiters"], note = "VM_Notify only queues the woken threads; they run in the same frame once the notifier yields, last registered first" }
hash_equality = { value = "script-error", confidence = "measured-in-engine", source = ["vm-t7-emulation#hash_equality"], note = "== between two hashes, or a string and a hash, is a non-terminal script error ('unmatching types') and yields false" }
thread_call_value = { value = "callee-result", confidence = "measured-in-engine", source = ["vm-t7-emulation#thread_call_assign_result"], note = "x = thread f() is f's return value when f ends without waiting, undefined when f waits first" }
