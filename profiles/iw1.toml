# Dialect profile: Call of Duty (2003).
# Schema: ../schema/profile.schema.json. Sources: ../sources.toml. Licence rule: ../README.md.

schema_version = 1
id = "iw1"
name = "Call of Duty"
release_year = 2003
developer = "Infinity Ward"
dialect_family = "iw"
grade = "verified-on-corpus"
aliases = ["cod1", "cod"]
source_availability = ["plain-source-archive"]
license = "CC0-1.0"
notes = "Measured on the retail pk3 scripts. CoD1 has no #include in its shipped scripts: cross-file calls are always path-qualified."

[tool_ids]

[keywords]
words = ["assertmsg", "break", "case", "continue", "default", "else", "endon", "false", "for", "if", "isdefined", "notify", "return", "switch", "thread", "true", "undefined", "wait", "waittill", "waittillmatch", "while"]
confidence = "assumed"
source = ["corpus-iw1", "inference"]
note = "gscode base minus waittillframeend (0 uses); the CoD1 binaries do not store keywords as strings; corpus: maps/_spawner.gsc assigns assert as a local variable (assert = false;, 2 uses in 1 file of corpus-iw1), so assert is not reserved; it is a builtin called like a function"

