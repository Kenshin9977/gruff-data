developer = "Infinity Ward"
dialect_family = "iw"
grade = "documented"
aliases = ["ghosts", "iw6x"]
source_availability = ["compiled-only"]
license = "CC0-1.0"
notes = "gsc-tool IW front end only."

[tool_ids]
