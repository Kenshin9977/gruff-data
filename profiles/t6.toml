[[unresolved]]
id = "t6-preprocessor"
features = ["preprocessor_define", "preprocessor_function_macros", "preprocessor_conditionals", "preprocessor_ifdef_undef", "predefined_macros", "header_directive"]
measure = "retail cannot be read from bytecode (expansion happens before code generation). Look for .gsh rawfiles or #define text among BO2 zone rawfiles, and trace the eyza #insert fixtures to the compiler that built them. Until then: retail mode off, community mode (gsc-tool t6) on"
[[unresolved.claims]]
source = "eyza-vscode-cod-gsc"
claim = "BO2 code it fails on uses #insert, #define, default parameters, autoexec, const, %a::b and at-block doc comments"
[[unresolved.claims]]
source = "gscode-dialect-facts"
claim = "no game before BO3 has a preprocessor"
[[unresolved.claims]]
source = "gsc-tool-arc-source"
claim = "the arc preprocessor gives t6 #define, #if/#ifdef/#ifndef/#elif/#else/#endif, #undef, #pragma, #warning, #error, #line, #include and #inline; #using, #insert, #precache and #namespace are reserved to the 64-bit (t7) context"
[[unresolved.claims]]
source = "plutonium-docs"
claim = "Plutonium T6 loads source or compiled scripts; its docs describe #include but not #define or #insert, call the built-in BO2 compiler old and flawed (nested foreach and continue in foreach loop forever) and recommend gsc-tool instead"
