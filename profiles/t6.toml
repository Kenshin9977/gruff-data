# Dialect profile: Call of Duty: Black Ops II (2012).
# Schema: ../schema/profile.schema.json. Sources: ../sources.toml. Licence rule: ../README.md.

schema_version = 1
id = "t6"
name = "Call of Duty: Black Ops II"
release_year = 2012
developer = "Treyarch"
dialect_family = "treyarch-pre-t7"
grade = "documented"
aliases = ["bo2", "blackops2"]
source_availability = ["compiled-only"]
license = "CC0-1.0"
notes = "Transitional Treyarch dialect. Feature values describe the RETAIL compiler. foreach (both forms) is retail, measured on the shipped bytecode. The preprocessor is not evidenced in retail and is a community-compiler extension: gsc-tool t6 accepts #define (object and function-like), #if/#ifdef/#ifndef/#elif/#elifdef/#elifndef/#else/#endif, #undef, #inline <file>.gsh, #include, and predefines __FILE__, __LINE__, __DATE__, __TIME__ and T6; it has no #insert. The `community` value on each preprocessor feature records that mode."

[tool_ids]
gsc_tool = "t6"
acts = "t6"
gscode = "bo2"

[keywords]
words = ["abs", "angleclamp180", "anglestoforward", "anglestoright", "anglestoup", "anim", "autoexec", "break", "case", "codecall", "const", "continue", "default", "do", "else", "endon", "false", "for", "foreach", "game", "getdvar", "getdvarcoloralpha", "getdvarcolorblue", "getdvarcolorgreen", "getdvarcolorred", "getdvarfloat", "getdvarint", "getdvarvector", "getfirstarraykey", "getnextarraykey", "gettime", "if", "in", "isdefined", "level", "notify", "private", "prof_begin", "prof_end", "return", "self", "switch", "thread", "true", "undefined", "vectorscale", "vectortoangles", "wait", "waitrealtime", "waittill", "waittillframeend", "waittillmatch", "while"]
confidence = "documented"
source = ["gsc-tool-syntax"]
license = "GPL-3.0-only"
note = "keywords of the gsc-tool ARC front end for t6; foreach and in are retail (t6-foreach settled on the bytecode); corpus: size is a local variable 65 times in 36 files of the acts output (size = x.size;); t6 stores identifiers as plain text, so the names are retail and size is not reserved (.size stays a field)"

