file_kinds = { value = ["gsc", "csc"], confidence = "verified-on-corpus", source = ["bytecode-t6", "plutonium-t6-scripts"], note = "retail bytecode: 2,534 .gsc and 1,331 .csc assets; .gsh exists only in community mode (gsc-tool #inline)", community = { value = ["gsc", "csc", "gsh"], tools = ["gsc-tool", "plutonium"], confidence = "documented", source = ["gsc-tool-arc-source", "plutonium-docs"], license = "GPL-3.0-only", note = ".gsh headers pulled in by gsc-tool #inline" } }
