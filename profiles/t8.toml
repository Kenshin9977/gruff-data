# Dialect profile: Call of Duty: Black Ops 4 (2018).
# Schema: ../schema/profile.schema.json. Sources: ../sources.toml. Licence rule: ../README.md.

schema_version = 1
id = "t8"
name = "Call of Duty: Black Ops 4"
release_year = 2018
developer = "Treyarch"
dialect_family = "treyarch-t7plus"
grade = "documented"
aliases = ["bo4", "blackops4"]
source_availability = ["compiled-only"]
license = "CC0-1.0"
notes = "Compiled-only. Evidence is the acts VM handler and opcode tables; source spelling follows the acts decompiler."

[tool_ids]
gsc_tool = "t8"
acts = "t8"
gscode = "bo4"

[keywords]
words = ["autoexec", "break", "builtin", "case", "childthread", "class", "const", "constructor", "continue", "default", "destructor", "do", "else", "event_handler", "false", "for", "foreach", "function", "goto", "if", "in", "is", "new", "not", "private", "return", "switch", "thread", "threadendon", "true", "undefined", "var", "wait", "while"]
confidence = "assumed"
source = ["acts-grammar", "corpus-t8"]
note = "literal words of the acts superset grammar, plus constructor and destructor (39 and 5 in the acts output, classes on) and const (const_locals on; not observable in compiled code); the retail keyword set is not observable"

[features]
# --- Files
file_kinds = { value = ["gsc", "csc"], confidence = "verified-on-corpus", source = ["corpus-t8", "acts-vm-tables"], note = "decompiled (acts output): 1,647 .gsc, 986 .csc; client VM flag set; .gsh not observable: compiled-only game, the construct does not survive compilation" }
