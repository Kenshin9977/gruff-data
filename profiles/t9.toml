array_argument_passing = { value = "copy-unless-ref-param", confidence = "measured-in-engine", source = ["vm-t9-emulation#array_param_plain", "vm-t9-emulation#array_param_plain_nested", "vm-t9-emulation#array_param_ref", "vm-t9-emulation#array_copy_on_assign"], note = "a plain parameter gets a deep copy (SafeCreateLocalVariables + CopyArray), a &name parameter shares the caller's array; b = a shares the array; a non-array given to a &name parameter is accepted silently (T7, T8: a script error)" }
