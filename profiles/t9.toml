# Dialect profile: Call of Duty: Black Ops Cold War (2020).
# Schema: ../schema/profile.schema.json. Sources: ../sources.toml. Licence rule: ../README.md.

schema_version = 1
id = "t9"
name = "Call of Duty: Black Ops Cold War"
release_year = 2020
developer = "Treyarch / Raven Software"
dialect_family = "treyarch-t7plus"
grade = "documented"
aliases = ["bocw", "cw", "coldwar"]
source_availability = ["compiled-encrypted"]
license = "CC0-1.0"
notes = "Compiled and encrypted. Evidence is the acts VM handler and opcode tables."

[tool_ids]
gsc_tool = "t9"
acts = "t9"
gscode = "bocw"

[keywords]
words = ["autoexec", "break", "builtin", "case", "childthread", "class", "const", "constructor", "continue", "default", "destructor", "do", "else", "event_handler", "false", "for", "foreach", "function", "goto", "if", "in", "is", "new", "not", "private", "return", "switch", "thread", "threadendon", "true", "undefined", "var", "wait", "while"]
confidence = "assumed"
source = ["acts-grammar", "corpus-t9"]
note = "literal words of the acts superset grammar, plus constructor and destructor (47 and 10 in the acts output, classes on) and const (const_locals on; not observable in compiled code); the retail keyword set is not observable"

[features]
# --- Files
file_kinds = { value = ["gsc", "csc"], confidence = "verified-on-corpus", source = ["corpus-t9", "acts-vm-tables"], note = "decompiled (acts output): 2,465 .gsc, 364 .csc; client VM flag set; .gsh not observable: compiled-only game, the construct does not survive compilation" }
