istring_literal = { value = true, confidence = "assumed", source = ["inference"], note = "0 uses in corpus-t9 (absence of use, not proof of absence)" }
hash_string_literal = { value = true, confidence = "verified-on-corpus", source = ["corpus-t9", "hash-inventory", "acts-grammar"], note = "decompiled (acts output): 126,302 uses in 2,398 files; 64-bit hashes" }
extra_string_prefixes = { value = [], confidence = "assumed", source = ["acts-grammar"], license = "GPL-3.0-only OR MIT", note = "acts accepts the s, r, #, @, t, %, o prefixes as a superset; 0 uses in corpus-t9 (absence of use, not proof of absence)" }
