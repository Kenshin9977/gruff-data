endon_multiple_events = { value = true, confidence = "measured-in-engine", source = ["vm-t9-emulation#endon_multiple_events"], note = "any of the events ends the thread" }
notify_wakes_waiters = { value = "inline", confidence = "measured-in-engine", source = ["vm-t9-emulation#notify_wakes_waiter_before_notifier_continues", "vm-t9-emulation#notify_reentrant", "vm-t9-emulation#notify_wake_order_two_waiters"], note = "the Notify handler runs each woken waiter inside the call, up to its next wait, last registered first; a notify sent by a woken waiter nests (T7 and T8 defer)" }
