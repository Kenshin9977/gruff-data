source = ["gscode-game-profiles", "gscode-supported-profiles"]
note = "corpus: maps/_spawner.gsc assigns assert as a local variable (assert = false;, 2 uses in 1 file of corpus-iw3), so assert is not reserved; it is a builtin called like a function"
license = "GPL-3.0-only"

