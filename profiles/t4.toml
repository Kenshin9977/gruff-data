global_objects = { value = ["self", "level", "game", "anim"], confidence = "documented", source = ["gscode-game-profiles"], license = "GPL-3.0-only" }
# --- Semantics that change analysis
array_argument_passing = { value = "copy", confidence = "measured-in-engine", source = ["vm-t4-emulation#array_param_plain", "vm-t4-emulation#array_param_plain_nested", "vm-t4-emulation#array_copy_on_assign", "vm-t4-emulation#array_in_struct_field"], note = "arrays are values: nothing is copied at the call or at b = a, but a write through a shared array copies it first (copy on write in the array-ref evaluator), so neither a callee nor another holder ever sees the change; no &name parameters (bad syntax)" }
waittill_multiple_events = { value = false, confidence = "measured-in-engine", source = ["vm-t4-emulation#waittill_more_args_sent", "vm-t4-emulation#waittill_fewer_args_sent", "vm-t4-emulation"], note = "the arguments after the event are names the VM binds the notify's values to; a second event string there is refused by the game's compiler (bad syntax, semantics/t4.toml waittill_any_of_events)" }
endon_multiple_events = { value = false, confidence = "measured-in-engine", source = ["vm-t4-emulation"], note = "the game's compiler refuses endon(\"first\", \"second\") (bad syntax, semantics/t4.toml endon_multiple_events, unsupported: the form cannot exist)" }
notify_wakes_waiters = { value = "deferred", confidence = "measured-in-engine", source = ["vm-t4-emulation#notify_wakes_waiter_before_notifier_continues", "vm-t4-emulation#notify_reentrant", "vm-t4-emulation#notify_wake_order_two_waiters"], note = "VM_Notify only queues the woken threads at the current time; they run in the same frame once the notifier yields, last registered first (as T7)" }
