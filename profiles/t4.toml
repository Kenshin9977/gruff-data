# Dialect profile: Call of Duty: World at War (2008).
# Schema: ../schema/profile.schema.json. Sources: ../sources.toml. Licence rule: ../README.md.

schema_version = 1
id = "t4"
name = "Call of Duty: World at War"
release_year = 2008
developer = "Treyarch"
dialect_family = "treyarch-pre-t7"
grade = "verified-on-corpus"
aliases = ["waw", "cod5"]
source_availability = ["mod-tools-raw", "rawfile-in-fastfile"]
license = "CC0-1.0"
notes = "gscode verified profile (waw): CoD4 base plus .csc."

[tool_ids]
gscode = "waw"

[keywords]
words = ["assertmsg", "break", "case", "continue", "default", "else", "endon", "false", "for", "if", "isdefined", "notify", "prof_begin", "prof_end", "return", "switch", "thread", "true", "undefined", "wait", "waittill", "waittillframeend", "waittillmatch", "while"]
confidence = "documented"
source = ["gscode-game-profiles", "gscode-supported-profiles"]
note = "corpus: maps/_spawner.gsc assigns assert as a local variable (assert = false;, 2 uses in 1 file of corpus-t4), so assert is not reserved; it is a builtin called like a function"
license = "GPL-3.0-only"

