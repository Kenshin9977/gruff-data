# Dialect profile: Call of Duty 2 (2005).
# Schema: ../schema/profile.schema.json. Sources: ../sources.toml. Licence rule: ../README.md.

schema_version = 1
id = "iw2"
name = "Call of Duty 2"
release_year = 2005
developer = "Infinity Ward"
dialect_family = "iw"
grade = "verified-on-corpus"
aliases = ["cod2"]
source_availability = ["plain-source-archive"]
license = "CC0-1.0"
notes = "Measured on the retail iwd scripts. Adds #include, waittillframeend and prof_begin/prof_end over iw1."

[tool_ids]

[keywords]
words = ["assertmsg", "break", "case", "continue", "default", "else", "endon", "false", "for", "if", "isdefined", "notify", "prof_begin", "prof_end", "return", "switch", "thread", "true", "undefined", "wait", "waittill", "waittillframeend", "waittillmatch", "while"]
confidence = "assumed"
source = ["corpus-iw2", "inference"]
note = "gscode base plus prof_begin and prof_end; the corpus shows waittillframeend, waittillmatch and prof_begin in use; corpus: maps/_spawner.gsc assigns assert as a local variable (assert = false;, 2 uses in 1 file of corpus-iw2), so assert is not reserved; it is a builtin called like a function"

