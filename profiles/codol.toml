# Dialect profile: Call of Duty Online (2015).
# Schema: ../schema/profile.schema.json. Sources: ../sources.toml. Licence rule: ../README.md.

schema_version = 1
id = "codol"
name = "Call of Duty Online"
release_year = 2015
developer = "Raven Software / Activision Shanghai"
dialect_family = "iw"
grade = "verified-on-corpus"
aliases = ["cod-online", "codo"]
source_availability = ["rawfile-in-fastfile"]
license = "CC0-1.0"
notes = "China-only free-to-play game on the Modern Warfare 3 (iw5) engine. Its fastfiles carry plain-source rawfiles: 211 .gsc (createfx, createart and map scripts), measured in evidence/corpus/codol.tsv. Features the corpus cannot show are carried from iw5 as assumed; the corpus is small and has no gameplay scripts, so a zero count says little."

[keywords]
words = ["anim", "assert", "assertex", "assertmsg", "break", "breakpoint", "call", "case", "childthread", "continue", "default", "do", "else", "endon", "false", "for", "foreach", "game", "if", "in", "level", "notify", "prof_begin", "prof_end", "return", "self", "size", "switch", "thisthread", "thread", "true", "undefined", "wait", "waittill", "waittillframeend", "waittillmatch", "while"]
confidence = "assumed"
source = ["inference"]
note = "carried from iw5 (gsc-tool IW front end); the codol corpus parses with this list without a syntax error, and no keyword of it is used as a variable or parameter name"

