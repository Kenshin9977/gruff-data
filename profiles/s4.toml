# Dialect profile: Call of Duty: Vanguard (2021).
# Schema: ../schema/profile.schema.json. Sources: ../sources.toml. Licence rule: ../README.md.

schema_version = 1
id = "s4"
name = "Call of Duty: Vanguard"
release_year = 2021
developer = "Sledgehammer Games"
dialect_family = "iw"
grade = "documented"
aliases = ["vg", "vanguard"]
source_availability = ["compiled-only"]
license = "CC0-1.0"
notes = "Compiled-only. gsc-tool IW front end."

[tool_ids]
gsc_tool = "s4"
gscode = "vg"

[keywords]
words = ["anim", "assert", "assertex", "assertmsg", "break", "breakpoint", "call", "case", "childthread", "continue", "default", "do", "else", "endon", "false", "for", "foreach", "game", "if", "in", "isdefined", "istrue", "level", "notify", "prof_begin", "prof_end", "return", "self", "size", "switch", "thisthread", "thread", "true", "undefined", "wait", "waitframe", "waittill", "waittillframeend", "waittillmatch", "while"]
confidence = "documented"
source = ["gsc-tool-syntax"]
license = "GPL-3.0-only"
note = "keywords of the gsc-tool IW front end; includes the global objects and size"

[features]
# --- Files
file_kinds = { value = ["gsc"], confidence = "assumed", source = ["inference"], note = "gsc-tool mentions .csc for the IW family without naming engines" }
# --- Lexing and literals
case_insensitive_identifiers = { value = true, confidence = "documented", source = ["gsc-tool-syntax"], license = "GPL-3.0-only" }
dev_blocks = { value = true, confidence = "documented", source = ["gsc-tool-syntax"], license = "GPL-3.0-only", note = "the gsc-tool IW lexer skips them unless --dev" }
doc_comment_style = { value = "triple-slash", confidence = "assumed", source = ["inference"] }
istring_literal = { value = true, confidence = "documented", source = ["gsc-tool-syntax"], license = "GPL-3.0-only" }
hash_string_literal = { value = false, confidence = "assumed", source = ["gsc-tool-syntax"], license = "GPL-3.0-only", note = "the gsc-tool IW front end has no hash-literal rule" }
extra_string_prefixes = { value = [], confidence = "assumed", source = ["inference"] }
anim_reference = { value = true, confidence = "documented", source = ["gsc-tool-syntax"], license = "GPL-3.0-only" }
anim_reference_qualified = { value = false, confidence = "assumed", source = ["gsc-tool-syntax"], license = "GPL-3.0-only", note = "gsc-tool documents it for ARC only" }
animtree_expression = { value = true, confidence = "documented", source = ["gsc-tool-syntax"], license = "GPL-3.0-only" }
dollar_identifiers = { value = false, confidence = "assumed", source = ["inference"] }
hashed_identifier_spellings = { value = ["id-token"], confidence = "documented", source = ["gsc-tool-syntax"], license = "GPL-3.0-only", note = "_id_, _func_ and _meth_ names are left untouched by the lexer" }
