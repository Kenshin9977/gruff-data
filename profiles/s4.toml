namespace_directive = { value = false, confidence = "documented", source = ["gsc-tool-syntax"], license = "GPL-3.0-only" }
path_qualified_calls = { value = true, confidence = "documented", source = ["gsc-tool-syntax"], license = "GPL-3.0-only" }
