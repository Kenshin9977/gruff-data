# Dialect profile: Call of Duty: Modern Warfare (2019) (2019).
# Schema: ../schema/profile.schema.json. Sources: ../sources.toml. Licence rule: ../README.md.

schema_version = 1
id = "iw8"
name = "Call of Duty: Modern Warfare (2019)"
release_year = 2019
developer = "Infinity Ward"
dialect_family = "iw"
grade = "documented"
aliases = ["mw19", "mw2019", "modernwarfare19"]
source_availability = ["compiled-only"]
license = "CC0-1.0"
notes = "Compiled-only. gsc-tool IW front end plus acts opcode tables."

[tool_ids]
gsc_tool = "iw8"
acts = "iw8"
gscode = "mw19"

[keywords]
