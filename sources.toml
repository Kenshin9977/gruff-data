# Source registry for gruff-data.
#
# Every `source = [...]` entry in a profile names one of the ids below, optionally followed by
# "#fragment" to point at a section (e.g. "gscode-game-profiles#imports").
#
# `license` is the licence of the SOURCE, not of this file. It drives the per-entry licence rule
# in README.md: an entry whose only evidence is a GPL source is labelled with that licence.
# `usage = "facts-only"` marks proprietary material: the project may record facts it re-derived
# from it (a feature is present or absent, a keyword exists, a count), never its text.
#
# Commits are the revisions read on 2026-11-05.

[sources.corpus-iw1]
kind = "corpus-measurement"
