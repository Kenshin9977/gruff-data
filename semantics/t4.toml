# (gruff/conformance/t4) in the game's own VM, emulated offline from the unwrapped single-player executable
# by gruff/tools/re/vm (Unicorn over the executable; nothing launched). The game's own
# compiler compiles each script at load. Facts only.
# Schema: ../schema/semantics.schema.json. Report: gruff/tools/re/reports/vm_t4.md.

[meta]
game = "t4"
extractor = "tools/re/vm/old_suite.py --game t4"
dump = "codwaw_flat.exe sha256:1e073a10ac66e47bd0d36d7848607333af4ab66b8af0e9c32d2662ffa79fc452"
date = "2026-11-06"
licence = "CC0-1.0"
