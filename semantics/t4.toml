[[behaviour]]
id = "array_assign_shared_reverse"
question = "after b = a, is a write through a seen through b (the other direction)?"
answer = "no: after b = a, a write through a leaves b as it was (b stays empty)"
result = "pass"
trace = ["f0 T0 b.size=0 b[0] defined=0"]
modes_agree = true
dialect = { vs = "t7", same = false, note = "T7 shares the array both ways (b.size=1 b[0]=7)" }

[[behaviour]]
id = "array_copy_on_assign"
question = "b = a for an array, then b is changed: does a change too (reference) or not (copy)?"
answer = "b = a then a write through b leaves a unchanged: arrays are values (copied when written while shared)"
result = "pass"
trace = ["f0 T0 a[0]=1 b[0]=2 a.size=1 b.size=2"]
modes_agree = true
evidence = ["static: the array-ref evaluator (0x692850) tests the array variable's reference count (+4) at 0x692ab6: when another holder shares it, it drops its reference (0x690040), allocates a new array (0x68ff60) and copies the elements into it (0x690770) before the write (copy on write); the emulated run of this script reaches 0x68ff60 and 0x690770 between `b = a` and the first write through b"]
dialect = { vs = "t7", same = false, note = "T7 shares the array (a[0]=2 b[0]=2 a.size=2 b.size=2)" }

