question = "T8 waittill binds no names: the notify sends a struct with one field, the waiter reads two: the missing one is undefined?"
answer = "a field the notify's payload struct does not have reads undefined"
result = "pass"
trace = ["f1 T1 a=1 b defined=0", "f1 T0 sent"]
modes_agree = true
dialect = { vs = "t8", same = false, note = "T8 queues the woken waiters for the end of the notifier's run (T7 too); T9 runs each one inside the notify" }

[[behaviour]]
id = "waittill_more_args_sent"
question = "the notify sends three plain values after the event: what does the waiter's result struct hold?"
answer = "plain values after the event are dropped: the waiter still wakes, with a struct that only has _notify"
result = "pass"
trace = ["f1 T1 struct=1 notify is e=1", "f1 T0 sent"]
modes_agree = true
dialect = { vs = "t8", same = false, note = "T8 queues the woken waiters for the end of the notifier's run (T7 too); T9 runs each one inside the notify" }

[[behaviour]]
id = "waittill_returns_struct"
question = "what does waittill return: a struct holding the event in _notify and the payload's fields?"
answer = "waittill returns a struct: the payload's fields, and _notify holding the event (a hash)"
result = "pass"
trace = ["f1 T1 notify is e=1 a=1 b=two", "f1 T0 sent"]
modes_agree = true
dialect = { vs = "t8", same = false, note = "T8 queues the woken waiters for the end of the notifier's run (T7 too); T9 runs each one inside the notify" }

[[behaviour]]
id = "waittillframeend_order"
question = "does waittillframeend resume at the end of the current frame, after threads that do not wait?"
answer = "waittillframeend resumes in the same frame after threads that do not wait"
result = "pass"
trace = ["f0 T0 main 1", "f0 T0 main 2", "f0 T1 frameend"]
modes_agree = true
dialect = { vs = "t8", same = true }

[[behaviour]]
id = "waittillmatch"
question = "waittillmatch({#name:\"x\"}, e) ignores a notify of e whose payload field differs and wakes on the matching one"
answer = "waittillmatch({#name:\"x\"}, e) skips a notify whose payload field differs and wakes, inside the notify, on the matching one"
result = "pass"
trace = ["f1 T0 sent y", "f1 T1 matched x", "f1 T0 sent x"]
modes_agree = true
dialect = { vs = "t8", same = false, note = "T8 queues the woken waiters for the end of the notifier's run (T7 too); T9 runs each one inside the notify" }

[[behaviour]]
id = "waittilltimeout"
question = "waittilltimeout(0.1, e) with no notify: when does it return and what is _notify?"
answer = "waittilltimeout(0.1, e) with no notify returns after 2 frames (100 ms), with _notify \"timeout\""
result = "pass"
trace = ["f0 T0 start", "f2 T0 returned, timeout=1"]
modes_agree = true
evidence = ["static: VM_SetTime (0x1bb4c90) fires a timeout entry when the VM time is >= its deadline (comisd + jb at 0x1bb4dff); T8's 0x2773760 uses jbe (strictly after)"]
dialect = { vs = "t8", same = false, note = "T8 returns after 3 frames (its timeouts fire only past the deadline)" }
