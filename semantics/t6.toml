[[behaviour]]
id = "wait_0"
question = "does wait 0 yield and resume in the same frame, the next one, or is it refused?"
answer = "wait 0 resumes in the same frame, before threads in waittillframeend"
result = "pass"
trace = ["f0 T0 before", "f0 T0 after wait 0", "f0 T1 other"]
modes_agree = true
dialect = { vs = "t7", same = true }

[[behaviour]]
id = "wait_005_is_one_frame"
question = "how many server frames do wait 0.05, wait 0.1 and wait 0.15 take?"
answer = "the VM time unit is one 50 ms frame: wait 0.05/0.1/0.15 take 1/2/3 frames"
result = "pass"
trace = ["f0 T0 start", "f1 T0 after 0.05", "f3 T0 after 0.1", "f6 T0 after 0.15"]
modes_agree = true
evidence = ["static: the Wait opcode (in VM_Execute near 0x7eefa0) converts seconds to time units x 20 on the server instance (x 60 on the client)"]
dialect = { vs = "t7", same = true }

[[behaviour]]
id = "wait_same_duration_order"
question = "two threads that wait the same time: do they resume in the order they started waiting?"
answer = "threads whose waits end in the same frame resume in reverse order of their wait calls"
result = "pass"
trace = ["f1 T3 c", "f1 T2 b", "f1 T1 a"]
modes_agree = true
dialect = { vs = "t7", same = true }

[[behaviour]]
id = "waitframe_one"
question = "does waitframe exist in T6?"
result = "unsupported"
reason = "T6 has no such builtin: the game's linker refuses the script at load (unresolved external)"
error = "Unresolved external :  \"waitframe\" with 1 parameters"
modes_agree = true
dialect = { vs = "t7", same = true, note = "same: T7 has no waitframe either (no T7 test)" }

[[behaviour]]
id = "waittill_any_of_events"
question = "can waittill take two events?"
result = "unsupported"
reason = "the form does not exist in T6: no; the compiler (gsc-tool) refuses the script"
compile_error = "illegal waittill param, must be a local variable or undefined"
modes_agree = true
evidence = ["the compiler is gsc-tool (no official BO2 compiler exists); its rejection is the compile side only"]
dialect = { vs = "t7", same = true, note = "same: T7 waittill takes one event" }

