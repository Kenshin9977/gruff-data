question = "a thread whose self is a struct nobody references any more: does it keep running?"
answer = "a thread whose self struct is no longer referenced keeps running and self stays defined (the thread holds it)"
result = "pass"
trace = ["f0 T1 start", "f1 T1 still running", "f1 T1 self defined=1"]
modes_agree = true
dialect = { vs = "t7", same = true }

[[behaviour]]
id = "thread_outlives_parent"
question = "a plain thread keeps running after the thread that started it ends (control for childthread)"
answer = "a plain thread outlives the thread that started it; same-time waits resume last-registered first"
result = "pass"
trace = ["f0 T1 parent start", "f0 T2 tick 0", "f1 T1 parent end", "f1 T2 tick 1", "f2 T2 tick 2", "f3 T2 tick 3"]
modes_agree = true
dialect = { vs = "t7", same = true }

[[behaviour]]
id = "thread_runs_until_first_wait"
question = "does `thread f()` run f at once, up to its first wait, before the caller goes on?"
answer = "thread f() runs f at once until its first wait, then the caller continues"
result = "pass"
trace = ["f0 T0 before", "f0 T1 child start", "f0 T0 after call", "f1 T1 child after wait"]
modes_agree = true
dialect = { vs = "t7", same = true }

[[behaviour]]
id = "thread_without_wait_runs_to_end"
question = "does a thread with no wait run to its end before the caller resumes?"
answer = "a thread with no wait runs to its end before the caller continues"
result = "pass"
trace = ["f0 T0 before", "f0 T1 child 1", "f0 T1 child 2", "f0 T0 after call"]
modes_agree = true
dialect = { vs = "t7", same = true }

[[behaviour]]
id = "undefined_arithmetic"
question = "what does undefined + 1 do at run time: an error that ends the thread, or a value?"
answer = "undefined + 1 is a non-terminal script error: the thread goes on and the result is undefined"
result = "pass"
