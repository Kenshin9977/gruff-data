# Modern Warfare Remastered script VM semantics, measured by running this project's own conformance scripts
# (gruff/conformance/h1) in the game's own VM, emulated offline from the multiplayer executable dump
# by gruff/tools/re/vm (Unicorn over the executable; nothing launched). The game
# ships no compiler (its scripts are bytecode compiled offline): gsc-tool compiles
# each script and the game's own loader links it. Facts only.
# Schema: ../schema/semantics.schema.json. Report: gruff/tools/re/reports/vm_iw.md.

[meta]
game = "h1"
extractor = "tools/re/vm/iw_suite.py --game h1"
dump = "h1_mp64_ship_dump.exe"
date = "2026-11-07"
licence = "CC0-1.0"
suite = "conformance/h1"
time_unit = "scrVarPub.time counted from the entry thread's start, one 50 ms server frame"
modes = ["retail (script debugger off); one mode only: no developer switch changes these behaviours, so modes_agree is true by construction"]

[[behaviour]]
id = "array_assign_shared_reverse"
question = "after b = a, is a write through a seen through b (the other direction)?"
answer = "no: after b = a, a write through a leaves b as it was (b stays empty)"
result = "pass"
trace = ["f0 T0 b.size=0 b[0] defined=0"]
modes_agree = true
dialect = { vs = "s1", same = true }

[[behaviour]]
id = "array_copy_on_assign"
question = "b = a for an array, then b is changed: does a change too (reference) or not (copy)?"
answer = "b = a then a write through b leaves a unchanged: arrays are values (copied when written while shared)"
result = "pass"
trace = ["f0 T0 a[0]=1 b[0]=2 a.size=1 b.size=2"]
modes_agree = true
dialect = { vs = "s1", same = true }

[[behaviour]]
id = "array_in_struct_field"
question = "an array stored in a struct field, then read into a local and changed: does the field change?"
answer = "a local read from a struct field and written does not change the field: the write copies the shared array"
result = "pass"
trace = ["f0 T0 field[0]=1"]
modes_agree = true
dialect = { vs = "s1", same = true }

[[behaviour]]
id = "array_param_plain"
question = "an array passed to a plain parameter and changed in the callee: does the caller see the change?"
answer = "an array passed to a plain parameter and written in the callee is not changed for the caller (the callee's write copies it)"
result = "pass"
trace = ["f0 T0 a[0]=1 a.size=1"]
modes_agree = true
dialect = { vs = "s1", same = true }

[[behaviour]]
id = "array_param_plain_nested"
question = "the copy made for a plain array parameter: shallow (inner arrays shared) or deep?"
answer = "a write into an inner array through a parameter is not seen by the caller: the inner array is shared by the copy and copied in its turn when written"
result = "pass"
trace = ["f0 T0 inner=1 outer.size=1"]
modes_agree = true
dialect = { vs = "s1", same = true }

[[behaviour]]
id = "array_param_ref"
question = "an array passed to a parameter declared &arr and changed in the callee: does the caller see the change?"
result = "unsupported"
reason = "H1 has no reference parameters: the compiler (gsc-tool) rejects `&arr` in a parameter list"
