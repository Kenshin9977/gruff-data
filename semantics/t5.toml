[[behaviour]]
id = "array_assign_shared_reverse"
question = "after b = a, is a write through a seen through b (the other direction)?"
answer = "after b = a, a write through a is not seen through b: a shared array is copied when written (copy on write), so b keeps the old empty array"
result = "pass"
trace = ["f0 T0 script error: pair 'b.size=0 b[0]=' and 'undefined' has unmatching types 'string' and 'undefined'", "f0 T0 undefined"]
modes_agree = true
dialect = { vs = "t6", same = true }

