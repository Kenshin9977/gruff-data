# World at War (T4) engine builtins: every entry of the four lookups (GSC/CSC x function/method)
# the compiler uses, read from the executable's static tables by
# gruff/tools/re/treyarch/old_builtins.py + build_old.py (lookups and handlers run under Unicorn).
# Names are the tables' own strings. Schema: ../schema/builtins.schema.json. Facts only.

schema_version = 1
game = "t4"
license = "CC0-1.0"
source = "extracted from game executable"

[coverage]
complete = false
note = "only the campaign executable was extracted: the multiplayer builtins are missing"
complete_modes = ["sp", "zm"]

[extraction]
tool = "gruff/tools/re/treyarch/old_builtins.py + build_old.py"
executable = "CoDWaW LanFixed.exe (unwrapped SP build of the Steam CoDWaW.exe 1.7), flattened"
pe_timestamp = 1445666630
modes = { sp = "CoDWaW LanFixed.exe", zm = "CoDWaW LanFixed.exe" }
entry_layout = "char *name, handler, int developer (12 bytes)"
variadic_max = 2147483647
counts = { gsc_function = 348, gsc_method = 556, csc_function = 129, csc_method = 44 }
corpus_type_measure = "tools/re/types_corpus.py: argument types of 50503 call sites in 1429 files; corpus_param_types derived for 298 entries (>= 5 typed sites, >= 95% one type)"
